<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no">
    <title>检测线路中...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        
        .checker-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .status {
            font-size: 16px;
            margin-bottom: 20px;
            min-height: 24px;
        }
        
        .progress-container {
            margin: 30px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .domain-list {
            text-align: left;
            margin-top: 30px;
            font-size: 14px;
        }
        
        .domain-item {
            padding: 10px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .domain-status {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .status-pending {
            background: #ffa500;
            animation: pulse 1.5s infinite;
        }
        
        .status-success {
            background: #4caf50;
        }
        
        .status-failed {
            background: #f44336;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #ffeb3b;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 235, 59, 0.1);
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="checker-container">
        <div class="logo">🌐</div>
        <h1>正在检测最佳线路</h1>
        <div class="status" id="status">初始化中...</div>
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div id="progressText">0%</div>
        </div>
        <div class="domain-list" id="domainList"></div>
        <div class="error-message" id="errorMessage" style="display: none;"></div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // 从 URL 参数或 localStorage 获取域名列表
            function getDomainList() {
                const urlParams = new URLSearchParams(window.location.search);
                const domainsParam = urlParams.get('domains');
                
                if (domainsParam) {
                    return domainsParam.split(',').map(d => d.trim()).filter(d => d.length > 0);
                }
                
                // 从 localStorage 获取
                const saved = localStorage.getItem('api_domain_list');
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        return [];
                    }
                }
                
                return [];
            }
            
            // 保存检测结果
            function saveResult(domain) {
                localStorage.setItem('xboard_api_domain', domain);
                localStorage.setItem('xboard_api_domain_expire', (Date.now() + 24 * 60 * 60 * 1000).toString());
            }
            
            // 更新状态
            function updateStatus(message) {
                document.getElementById('status').textContent = message;
            }
            
            // 更新进度
            function updateProgress(current, total) {
                const percent = Math.round((current / total) * 100);
                document.getElementById('progress').style.width = percent + '%';
                document.getElementById('progressText').textContent = percent + '%';
            }
            
            // 更新域名状态
            function updateDomainStatus(domain, status, message) {
                const list = document.getElementById('domainList');
                let item = document.getElementById('domain-' + btoa(domain));
                
                if (!item) {
                    item = document.createElement('div');
                    item.className = 'domain-item';
                    item.id = 'domain-' + btoa(domain);
                    list.appendChild(item);
                }
                
                const statusClass = {
                    'pending': 'status-pending',
                    'success': 'status-success',
                    'failed': 'status-failed'
                }[status] || 'status-pending';
                
                item.innerHTML = `
                    <div>
                        <span class="domain-status ${statusClass}"></span>
                        <span>${domain}</span>
                    </div>
                    <div style="font-size: 12px; opacity: 0.8;">${message || ''}</div>
                `;
            }
            
            // 测试域名
            async function testDomain(domain, timeout = 5000) {
                const testUrl = domain.replace(/\/$/, '') + '/api/v1/guest/comm/config?t=' + Date.now();
                const startTime = Date.now();
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                
                try {
                    const response = await fetch(testUrl, {
                        method: 'GET',
                        signal: controller.signal,
                        cache: 'no-cache',
                        mode: 'cors',
                        credentials: 'omit'
                    });
                    
                    clearTimeout(timeoutId);
                    const elapsed = Date.now() - startTime;
                    
                    if (response.status === 200) {
                        return { success: true, elapsed };
                    } else {
                        return { success: false, error: `HTTP ${response.status}`, elapsed };
                    }
                } catch (error) {
                    clearTimeout(timeoutId);
                    const elapsed = Date.now() - startTime;
                    
                    if (error.name === 'AbortError') {
                        return { success: false, error: '超时', elapsed };
                    } else {
                        return { success: false, error: '网络错误', elapsed };
                    }
                }
            }
            
            // 检测所有域名
            async function checkDomains() {
                const domains = getDomainList();
                
                if (domains.length === 0) {
                    updateStatus('未配置域名列表');
                    document.getElementById('errorMessage').style.display = 'block';
                    document.getElementById('errorMessage').textContent = '未找到域名配置，请检查配置';
                    return null;
                }
                
                updateStatus(`正在检测 ${domains.length} 个域名...`);
                
                // 并行测试所有域名（使用 Promise.race 找到第一个可用的）
                const testPromises = domains.map(async (domain, index) => {
                    updateDomainStatus(domain, 'pending', '检测中...');
                    updateProgress(index, domains.length);
                    
                    const result = await testDomain(domain, 5000);
                    
                    if (result.success) {
                        updateDomainStatus(domain, 'success', `可用 (${result.elapsed}ms)`);
                        return { domain, result };
                    } else {
                        updateDomainStatus(domain, 'failed', result.error || '不可用');
                        return null;
                    }
                });
                
                // 等待所有测试完成，找到第一个可用的
                const results = await Promise.all(testPromises);
                const available = results.find(r => r !== null);
                
                updateProgress(domains.length, domains.length);
                
                if (available) {
                    updateStatus(`找到可用域名: ${available.domain}`);
                    saveResult(available.domain);
                    
                    // 延迟一下让用户看到结果
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    return available.domain;
                } else {
                    updateStatus('所有域名都不可用');
                    document.getElementById('errorMessage').style.display = 'block';
                    document.getElementById('errorMessage').textContent = '所有域名都不可用，请检查网络连接或联系管理员';
                    return null;
                }
            }
            
            // 跳转到主应用
            function redirectToApp(domain) {
                // 构建跳转 URL，保留当前路径但使用检测到的域名
                const currentPath = window.location.pathname;
                const newUrl = domain + currentPath + window.location.search;
                
                // 设置 window.routerBase 以便主应用使用
                if (window.opener) {
                    // 如果是弹窗，更新父窗口
                    window.opener.window.routerBase = domain + '/';
                    window.opener.window.settings = window.opener.window.settings || {};
                    window.opener.window.settings.base_url = domain + '/';
                    window.close();
                } else {
                    // 直接跳转
                    window.location.href = newUrl;
                }
            }
            
            // 主函数
            async function init() {
                try {
                    const availableDomain = await checkDomains();
                    
                    if (availableDomain) {
                        // 如果是从主应用跳转过来的，返回主应用
                        const returnUrl = new URLSearchParams(window.location.search).get('return');
                        if (returnUrl) {
                            window.location.href = returnUrl + '?api_domain=' + encodeURIComponent(availableDomain);
                        } else {
                            redirectToApp(availableDomain);
                        }
                    }
                } catch (error) {
                    console.error('检测失败:', error);
                    updateStatus('检测过程出错');
                    document.getElementById('errorMessage').style.display = 'block';
                    document.getElementById('errorMessage').textContent = '检测过程出错: ' + error.message;
                }
            }
            
            // 启动检测
            init();
        })();
    </script>
</body>
</html>
