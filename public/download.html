<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>妈祖VPN | 应用下载</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:rgba(255,255,255,.08);
      --primary:#38bdf8;
      --accent:#a78bfa;
      --text:#e2e8f0;
      --muted:#94a3b8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"HarmonyOS Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top,#1d2671,#0f172a);
      color:var(--text);
      min-height:100vh;
    }
    header{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:left;
      padding:48px 5vw;
    }
    header img{
      width:96px;
      height:96px;
      border-radius:24px;
      box-shadow:0 15px 40px rgba(0,0,0,.45);
    }
    header h1{margin:18px 0 4px;font-size:42px;font-weight:700}
    header p{margin:0;font-size:18px;color:var(--muted)}

    .content{
      width:100%;
      max-width:1200px;
      margin-top:48px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:40px;
    }

    .download-column{
      border-left:3px solid var(--primary);
      padding-left:32px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .download-column h2{margin:0;font-size:28px}
    .platform-row{
      display:flex;
      flex-direction:column;
    }
    .platform-row div:last-child{border-bottom:none}
    .platform-row h3{margin:0;font-size:22px}
    .platform-row small{color:var(--muted)}
    .platform-row p{margin:8px 0 12px;color:var(--muted)}
    .btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:10px 26px;
      border-radius:999px;
      background:var(--primary);
      color:#0f172a;
      font-weight:600;
      text-decoration:none;
    }
    .ios-note{font-size:12px;color:var(--muted)}

    .info-column{
      border-left:3px solid var(--accent);
      padding-left:32px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    dl{margin:0}
    dt{font-size:20px;font-weight:600;margin-top:18px}
    dd{margin:6px 0 0;color:var(--muted)}

    .steps{
      border-top:1px dashed rgba(226,232,240,.2);
      padding-top:10px;
    }
    .steps ol{margin:0;padding-left:20px;color:var(--muted)}
    .steps li{margin-bottom:10px}

    .support{
      margin-top:8px;
      font-size:14px;
      color:var(--muted);
    }

    footer{
      text-align:center;
      padding:24px;
      color:var(--muted);
      font-size:12px;
    }

    #wechatMask{
      position:fixed;
      inset:0;
      background:rgba(2,6,23,.92);
      display:none;
      align-items:center;
      justify-content:center;
      color:#fff;
      padding:32px;
      text-align:center;
      z-index:1000;
      font-size:18px;
      line-height:1.6;
    }

    @media(max-width:640px){
      header{text-align:center;align-items:center}
      .download-column,.info-column{border-left:none;padding-left:0;padding-top:14px}
    }
  </style>
</head>
<body>
  <header>
    <img src="https://mazucloud.shop/img/ic_launcher.webp" alt="logo">
    <h1>妈祖VPN</h1>
    <p>极速 · 稳定 · 面向团队的隐私守护方案</p>

    <div class="content">
      <section class="download-column">
        <div class="platform-row">
          <div data-platform="android">
            <a id="androidBtn" class="btn" href="#" download>下载 APK</a>
          </div>
          <div data-platform="ios">
            <a id="iosBtn" class="btn" href="#">开始安装</a>
            <div class="ios-note">安装完成后：设置 → 通用 → VPN 与设备管理 → 选择企业证书并信任。</div>
          </div>
        </div>
      </section>

      <section class="info-column">
        <dl>
          <dd>优选线路 + 智能调度</dd>
          <dd>Android / iOS / Windows / macOS 统一账号，设置自动同步。</dd>
        </dl>
        <div class="steps">
          <h3>安装步骤</h3>
          <ol>
            <li>点击上方按钮下载 / 安装应用。</li>
            <li>首次打开后登录账号，同步套餐与节点。</li>
          </ol>
        </div>
      </section>
    </div>
  </header>

  <footer>© 2026 妈祖VPN · All rights reserved.</footer>

  <div id="wechatMask"><span id="wechatTip">请点击右上角“···”并选择“在浏览器中打开”</span></div>

  <script>
    const CONFIG = {
      name: '妈祖VPN',
      description: '极速 · 稳定 · 隐私守护',
      logo: '/assets/logo.png',
      android_url: 'https://mazucloud.shop/maclash_beta.apk',
      ios_url: 'https://example.com/mazu.ipa'
    };

    const ua = navigator.userAgent.toLowerCase();
    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = /android/.test(ua);
    const isWeChat = /micromessenger/.test(ua);

    document.getElementById('androidBtn').href = CONFIG.android_url;
    document.getElementById('iosBtn').href = CONFIG.ios_url;

    if (isWeChat) {
      document.getElementById('wechatMask').style.display = 'flex';
      document.getElementById('wechatTip').innerText = isIOS
        ? '请点击右上角 “···” 并选择“在 Safari 中打开”'
        : '请点击右上角 “···” 并选择“在浏览器中打开”';
    }

    document.querySelectorAll('[data-platform]').forEach(block => {
      const type = block.dataset.platform;
      if (isAndroid && type !== 'android') block.style.display = 'none';
      if (isIOS && type !== 'ios') block.style.display = 'none';
    });
  </script>
</body>
</html>
